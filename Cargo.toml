[package]
name = "worktree-tui"
version = "0.1.0"
edition = "2021"
description = "A high-performance, beautiful TUI for managing Git worktrees, inspired by lazygit."
authors = ["you <you@example.com>"]
repository = "https://github.com/yourname/worktree-tui"
license = "MIT"
readme = "README.md"

[features]
default = []

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

[dev-dependencies]

[workspace]
